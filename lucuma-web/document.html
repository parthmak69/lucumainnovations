<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">

    <title>Lucuma Docs | Document Viewer</title>

    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            margin: 0;
            background: #eef2f7;
            color: #172033;
            font-family: Manrope, Arial, sans-serif;
        }

        .viewer-top {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: white;
            border-bottom: 1px solid #e5eaf0;
        }

        .viewer-brand {
            font-weight: 800;
            letter-spacing: 1px;
        }

        .viewer-actions {
            display: flex;
            gap: 10px;
        }

        .viewer-actions button,
        .viewer-actions a {
            padding: 11px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            background: #172033;
            color: white;
        }

        .viewer-actions a {
            background: #e9edf3;
            color: #172033;
        }

        .viewer-wrap {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 16px;
        }

        .viewer-message {
            background: white;
            padding: 40px;
            border-radius: 14px;
            text-align: center;
        }

        .viewer-message.error h2 {
            color: #b42318;
        }

        .viewer-document {
            max-width: 900px;
            margin: auto;
            padding: 35px;
            background: white;
            box-shadow: 0 8px 35px #17203312;
        }

        .viewer-document .qr svg {
            width: 110px;
            height: 110px;
        }

        .viewer-qr {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
            font-size: 11px;
            text-align: center;
        }

        .viewer-qr .qr {
            width: 110px;
        }

        .viewer-qr .qr svg {
            width: 100%;
            height: auto;
        }

        .viewer-meta {
            font-size: 11px;
            color: #64748b;
        }

        .viewer-letter-body {
            line-height: 1.8;
            font-size: 14px;
        }

        .viewer-letter-body p {
            margin: 14px 0;
        }

        .viewer-signatures {
            display: flex;
            justify-content: space-between;
            gap: 25px;
            margin-top: 55px;
            font-size: 12px;
        }

        .viewer-signatures img {
            max-width: 110px;
            max-height: 65px;
            object-fit: contain;
        }

        .viewer-certificate {
            text-align: center;
            border: 9px double #b69a55;
            padding: 35px;
        }

        .viewer-certificate h2 {
            font-size: 28px;
            color: #a4863d;
        }

        .viewer-holder {
            font-size: 34px;
            font-weight: 800;
            margin: 25px 0;
        }

        .viewer-invoice .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .viewer-invoice .box {
            border: 1px solid #dfe5ed;
            padding: 15px;
            margin: 18px 0;
        }

        .viewer-invoice table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .viewer-invoice td,
        .viewer-invoice th {
            padding: 9px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        .viewer-invoice .total {
            text-align: right;
            font-size: 18px;
            font-weight: 800;
            margin-top: 18px;
        }

        .viewer-invoice .footer {
            margin-top: 35px;
            font-size: 11px;
            color: #64748b;
            text-align: center;
        }

        [hidden] {
            display: none !important;
        }

        @media(max-width:650px) {
            .viewer-document {
                padding: 18px;
            }

            .viewer-invoice .two {
                grid-template-columns: 1fr;
            }

            .viewer-holder {
                font-size: 25px;
            }

            .viewer-top {
                padding: 12px;
            }
        }

/* =========================================
   PROFESSIONAL DOCUMENT PRINT SETTINGS
========================================= */

@page {
    size: A4;
    margin: 12mm;
}

@media print {

    /* Hide application navigation */
    .viewer-top,
    #library,
    #loading,
    #error {
        display: none !important;
    }

    /* Reset browser layout */
    html,
    body {
        width: 100% !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        color: #172033 !important;
    }

    body {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
    }

    /* Main document container */
    .viewer-wrap {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
    }

    #documentContent {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    /* Preserve document dimensions */
    .viewer-document {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        box-shadow: none !important;
        box-sizing: border-box !important;
    }

    /* Keep certificate dimensions separate from other documents */
    .viewer-document.page.cert {
        width: 1123px !important;
        height: 794px !important;
        max-width: none !important;
        margin: 0 auto !important;
        padding: 0 !important;
        position: relative !important;
        overflow: hidden !important;
        box-sizing: border-box !important;
        page: cert !important;
    }

    /* Preserve certificate design */
    .viewer-certificate {
        border: 9px double #b69a55 !important;
        text-align: center !important;
    }

    /* Preserve invoice layout */
    .viewer-invoice .two {
        display: grid !important;
        grid-template-columns: 1fr 1fr !important;
        gap: 20px !important;
    }

    .viewer-invoice table {
        width: 100% !important;
        border-collapse: collapse !important;
    }

    .viewer-invoice th,
    .viewer-invoice td {
        padding: 9px !important;
        text-align: left !important;
    }

    .viewer-invoice .box {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
    }

    /* Preserve signatures and QR codes */
    .viewer-signatures,
    .viewer-qr {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
    }

    .viewer-qr svg {
        width: 110px !important;
        height: 110px !important;
    }

    /* Avoid splitting table rows */
    tr {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
    }

    /* Remove unwanted link decorations */
    a {
        color: inherit !important;
        text-decoration: none !important;
    }
}

        #library table th,
#library table td {
    padding: 13px;
    border-bottom: 1px solid #e5eaf0;
    white-space: nowrap;
}

#library table th {
    background: #f5f7fa;
}

.lib-filter {
    border: 1px solid #dfe5ed;
    background: white;
    padding: 9px 16px;
    border-radius: 7px;
    cursor: pointer;
}

.lib-filter:hover {
    background: #172033;
    color: white;
}

.lib-open {
    display: inline-block;
    padding: 7px 13px;
    background: #172033;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

/* CERTIFICATE PRINT FORMAT */

/* CERTIFICATE PRINT FORMAT */

@page cert {
    size: A4 landscape;
    margin: 0;
}

@media print {

    .viewer-document.page.cert {
        width: 1123px !important;
        height: 794px !important;
        margin: 0 auto !important;
        padding: 0 !important;
        position: relative !important;
        overflow: hidden !important;
        box-shadow: none !important;
        page: cert !important;
        print-color-adjust: exact !important;
        -webkit-print-color-adjust: exact !important;
    }

    .viewer-document.page.cert .cin {
        position: absolute !important;
        inset: 46px 96px 50px !important;
        box-sizing: border-box !important;
    }

    .viewer-document.page.cert .cbot {
        margin-top: auto !important;
    }
}
    </style>
</head>

<body>

<header class="viewer-top">
    <div class="viewer-brand">LUCUMA DOCS</div>

    <div class="viewer-actions">
        <a href="document.html" id="backBtn">Back</a>
        <button id="printBtn" type="button">Print / PDF</button>
    </div>
</header>

<main class="viewer-wrap">

    <!-- Loading -->
    <div id="loading" class="viewer-message">
        <h2>Loading document...</h2>
        <p>Please wait while we retrieve your document.</p>
    </div>

    <!-- Error -->
    <section id="error" class="viewer-message error" hidden>
        <h2>Unable to Load Document</h2>
        <p id="errorMessage"></p>
        <a href="verify.html">Return to Verification</a>
    </section>

    <!-- Individual Document -->
    <div id="documentContent" hidden></div>

    <!-- Document Library -->
    <section id="library" class="viewer-message" hidden>

        <h2>Lucuma Docs — Document Library</h2>

        <p id="libraryMessage">Loading your documents...</p>

        <input
            id="librarySearch"
            type="search"
            placeholder="Search by document number, name or type..."
            style="width:100%;max-width:500px;padding:12px;margin:15px 0;border:1px solid #dfe5ed;border-radius:8px;"
        >

        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px;">
            <button class="lib-filter" data-filter="all">All</button>
            <button class="lib-filter" data-filter="letter">Letters</button>
            <button class="lib-filter" data-filter="certificate">Certificates</button>
            <button class="lib-filter" data-filter="invoice">Invoices</button>
        </div>

        <div style="overflow-x:auto;">
            <table style="width:100%;border-collapse:collapse;text-align:left;">
                <thead>
                    <tr>
                        <th>Document No.</th>
                        <th>Type</th>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="libraryRows"></tbody>
            </table>
        </div>

    </section>

</main>

<!-- Supabase configuration -->
<script src="./config.js"></script>

<!-- QR Code generator -->
<script src="./vendor/qrcode.js"></script>

<!-- Document viewer -->
<script src="./document.js"></script>

</body>
</html>
