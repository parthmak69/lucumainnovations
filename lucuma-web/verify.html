<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src https://*.supabase.co">

  <title>Verify Certificate · Lucuma Innovations</title>

  <link rel="stylesheet" href="fonts.css">

</head>

<body class="vbody">

  <div class="bgfx">
    <i></i><i></i><i></i>
  </div>

  <div class="vwrap">
    <div class="glass v">

      <img src="assets/logo.png" class="vlogo" alt="Lucuma Innovations">

      <h2>Certificate verification</h2>
      <p class="vsub">Lucuma Innovations</p>

      <div id="vres"></div>

      <form id="vf">
        <label>Certificate number</label>

        <input id="vn"
               placeholder="LI-C-2026-XXXXXXXX"
               autocomplete="off">

        <button class="btn p"
                style="width:100%;margin-top:14px">
          Verify
        </button>
      </form>

    </div>
  </div>

<script src="config.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="verify.js"></script>

</html>
