<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lucuma Docs · Company Workspace</title><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="workspace.css"></head>
<body><header class="bar"><a href="index.html" class="back">← Lucuma Docs</a><div><small>COMPANY OPERATIONS</small><h1>Workspace</h1></div><button id="signout" class="quiet">Sign out</button></header>
<main class="layout"><aside class="glass side"><h2>Modules</h2><nav id="module-nav"></nav><p class="note">Data shown here is loaded from your connected Supabase database. Empty modules are not populated with sample records.</p></aside><section class="glass main"><div class="heading"><div><small id="module-eyebrow">WORKSPACE</small><h2 id="module-title">Select a module</h2><p id="module-description"></p></div><button id="new-record" class="primary" hidden>＋ Create</button></div><div id="message" role="status"></div><div id="records"></div></section></main>
<dialog id="editor"><form method="dialog" id="record-form"><div class="dialog-head"><h2 id="form-title">Create record</h2><button type="button" id="close-dialog" class="quiet">✕</button></div><div id="fields"></div><div class="actions"><button type="button" id="cancel" class="quiet">Cancel</button><button type="submit" class="primary">Save</button></div></form></dialog>
<script src="config.js"></script><script src="workspace.js"></script></body></html>
